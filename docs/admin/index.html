<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Admin | Materi Boys' Senior School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/shared.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/admin.css" />
    <link rel="icon" href="../logo/favicon.ico" type="image/x-icon" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-sidebar__header">
          <h1>Mitiri Boys' Senior School</h1>
          <p>Manage school content</p>
        </div>
        <nav class="admin-sidebar__nav" aria-label="Admin navigation">
          <label class="admin-sidebar__toggle" for="admin-admissions-toggle">
            <input type="checkbox" id="admin-admissions-toggle" />
            <span class="admin-sidebar__toggle-text" id="admin-admissions-toggle-text">Admissions is open</span>
          </label>
          <button class="admin-sidebar__link is-active" type="button" data-section="Admissions upload" data-title="Admission form" data-heading="Upload admissions document" data-description="Choose a document to make it available on the admissions page." data-storage-key="admissions" data-page="application-form.html" data-mode="document">Admissions upload</button>
          <button class="admin-sidebar__link" type="button" data-section="Fee schedule upload" data-title="Fee schedule" data-heading="Upload fee schedule" data-description="Choose a fee schedule document to make it available on the downloads page." data-storage-key="fee-schedule" data-page="fee-schedule.html" data-mode="document">Fee schedule upload</button>
          <button class="admin-sidebar__link" type="button" data-section="Interview requirements upload" data-title="Interview requirements" data-heading="Upload interview requirements" data-description="Choose a document to share interview requirements with applicants." data-storage-key="interview-requirements" data-page="interview-requirements.html" data-mode="document">Interview requirements upload</button>
          <button class="admin-sidebar__link" type="button" data-section="Prospectus upload" data-title="Prospectus" data-heading="Upload prospectus" data-description="Choose a prospectus or school brochure to publish for families." data-storage-key="prospectus" data-page="prospectus.html" data-mode="document">Prospectus upload</button>
          <div class="admin-sidebar__group" id="vacancies-sidebar-group">
            <button class="admin-sidebar__link admin-sidebar__link--parent" type="button" data-section="Vacancies" data-title="Vacancies" data-heading="Post a teaching vacancy" data-description="Add a teacher vacancy with position, post count, and requirements." data-storage-key="vacancies" data-mode="vacancies" data-vacancy-type="teachers">Vacancies</button>
            <div class="admin-sidebar__children" id="vacancies-sidebar-children">
              <button class="admin-sidebar__link admin-sidebar__link--child" type="button" data-section="Vacancies - Teachers" data-title="Teachers" data-heading="Post a teaching vacancy" data-description="Add a teacher vacancy with position, post count, and requirements." data-storage-key="vacancies" data-mode="vacancies" data-vacancy-type="teachers">Teachers</button>
              <button class="admin-sidebar__link admin-sidebar__link--child" type="button" data-section="Vacancies - Support staff" data-title="Support staff" data-heading="Post a support staff vacancy" data-description="Add a support staff vacancy with position, post count, and requirements." data-storage-key="vacancies" data-mode="vacancies" data-vacancy-type="support-staff">Support staff</button>
            </div>
          </div>
          <button class="admin-sidebar__link" type="button" data-section="Alumni registrations" data-title="Alumni registrations" data-heading="Alumni registrations" data-description="View and manage alumni registrations submitted through the public form." data-storage-key="alumni" data-mode="alumni">Alumni registrations</button>
          <button class="admin-sidebar__link" type="button" data-section="News &amp; blogs" data-title="School news" data-heading="Create school news post" data-description="Write a story for the school news section and optionally add an attachment or a YouTube link." data-storage-key="news" data-mode="news">News &amp; blogs</button>
        </nav>
        <button id="admin-logout-button" class="admin-sidebar__logout" type="button">Logout</button>
      </aside>

      <main class="admin-main">
        <header class="admin-main__header">
          <div>
            <p class="eyebrow">Admin panel</p>
            <h2 id="admin-section-title">Admissions upload</h2>
          </div>
          <a href="../home/" class="button button--secondary">Back to site</a>
        </header>

        <section class="admin-card">
          <h3 id="admin-card-heading">Upload admissions document</h3>
          <p id="admin-card-description">Choose a document to make it available on the admissions page.</p>
          <form class="admin-form" id="admin-upload-form" hidden>
            <label class="admin-form__field" id="title-field" hidden>
              <span>Title</span>
              <input type="text" id="admin-title-input" name="title" value="Admission form" placeholder="Application form" />
            </label>
            <div class="admin-form__group" id="vacancies-fields" hidden>
              <div id="vacancies-teachers-fields">
                <div class="admin-form__group admin-form__group--two-col">
                  <label class="admin-form__field">
                    <span>Pathway</span>
                    <input type="text" id="admin-pathway-input" name="pathway" placeholder="e.g. STEM" />
                  </label>
                  <label class="admin-form__field">
                    <span>Subjects</span>
                    <input type="text" id="admin-subjects-input" name="subjects" placeholder="e.g. Mathematics, Physics" />
                  </label>
                </div>
              </div>
              <div id="vacancies-support-fields" hidden>
                <label class="admin-form__field">
                  <span>Position</span>
                  <input type="text" id="admin-position-input" name="position" placeholder="e.g. Driver" />
                </label>
              </div>
              <div class="admin-form__group admin-form__group--two-col">
                <label class="admin-form__field">
                  <span>Posts</span>
                  <input type="number" id="admin-posts-input" name="posts" min="1" step="1" placeholder="1" />
                </label>
                <label class="admin-form__field">
                  <span>Requirements</span>
                  <textarea id="admin-requirements-input" name="requirements" rows="4" placeholder="List qualifications, experience, and skills required."></textarea>
                </label>
              </div>
            </div>
            <div class="admin-form__group" id="news-only-fields" hidden>
              <label class="admin-form__field" id="news-story-field">
                <span>Story</span>
                <div class="admin-richtext">
                  <div class="admin-richtext__toolbar" role="toolbar" aria-label="Text formatting tools">
                    <button type="button" data-command="bold" class="admin-richtext__button" aria-label="Bold">B</button>
                    <button type="button" data-command="italic" class="admin-richtext__button" aria-label="Italic">I</button>
                    <button type="button" data-command="underline" class="admin-richtext__button" aria-label="Underline">U</button>
                    <button type="button" data-command="insertUnorderedList" class="admin-richtext__button" aria-label="Bullet list">•</button>
                    <button type="button" data-command="insertOrderedList" class="admin-richtext__button" aria-label="Numbered list">1.</button>
                    <button type="button" data-command="formatBlock" data-value="h2" class="admin-richtext__button" aria-label="Heading">H2</button>
                    <button type="button" data-command="hiliteColor" data-value="yellow" class="admin-richtext__button" aria-label="Highlight">Mark</button>
                  </div>
                  <div id="admin-story-input" class="admin-richtext__editor" contenteditable="true" spellcheck="true" data-placeholder="Write a school news story here"></div>
                </div>
              </label>
              <label class="admin-form__field" id="news-video-field">
                <span>Optional YouTube URL</span>
                <input type="url" id="admin-video-url-input" name="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
              </label>
            </div>
            <label class="admin-form__field" id="file-field">
              <span>Upload file</span>
              <input type="file" name="file" id="admin-file-input" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx" />
            </label>
            <button type="submit" class="button button--primary" id="admin-submit-button" hidden>Save upload</button>
            <p class="admin-form__status" id="admin-form-status" aria-live="polite"></p>
          </form>

          <div class="admin-management" id="admin-management-panel">
            <div class="admin-management__header">
              <h4>Posted items</h4>
              <p id="admin-management-caption">Manage the content already posted in this section.</p>
            </div>
            <div class="admin-management__table-wrap">
              <table class="admin-management__table">
                <thead>
                  <tr id="admin-management-header-row">
                    <th>Title</th>
                    <th>Details</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="admin-management-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module">
      import { stateManager } from '../js/modules/state-manager.js';
      import { showToast } from '../js/modules/toast.js';

      const buttons = Array.from(document.querySelectorAll('.admin-sidebar__link'));
      const titleInput = document.getElementById('admin-title-input');
      const sectionTitle = document.getElementById('admin-section-title');
      const cardHeading = document.getElementById('admin-card-heading');
      const cardDescription = document.getElementById('admin-card-description');
      const adminCard = document.querySelector('.admin-card');
      const uploadForm = document.getElementById('admin-upload-form');
      const fileInput = document.getElementById('admin-file-input');
      const statusText = document.getElementById('admin-form-status');
      const submitButton = document.getElementById('admin-submit-button');
      const fileField = document.getElementById('file-field');
      const titleField = document.getElementById('title-field');
      const vacanciesFields = document.getElementById('vacancies-fields');
      const newsOnlyFields = document.getElementById('news-only-fields');
      const storyEditor = document.getElementById('admin-story-input');
      const videoUrlInput = document.getElementById('admin-video-url-input');
      const pathwayInput = document.getElementById('admin-pathway-input');
      const subjectsInput = document.getElementById('admin-subjects-input');
      const positionInput = document.getElementById('admin-position-input');
      const postsInput = document.getElementById('admin-posts-input');
      const requirementsInput = document.getElementById('admin-requirements-input');
      const teacherVacancyFields = document.getElementById('vacancies-teachers-fields');
      const supportVacancyFields = document.getElementById('vacancies-support-fields');
      const managementBody = document.getElementById('admin-management-body');
      const managementHeader = document.getElementById('admin-management-header-row');
      const managementCaption = document.getElementById('admin-management-caption');
      const vacanciesSidebarGroup = document.getElementById('vacancies-sidebar-group');
      const vacanciesSidebarChildren = document.getElementById('vacancies-sidebar-children');
      const admissionsToggle = document.getElementById('admin-admissions-toggle');
      const admissionsToggleText = document.getElementById('admin-admissions-toggle-text');

      const CLOUDINARY_CLOUD_NAME = 'djbkqazzt';
      const CLOUDINARY_UPLOAD_PRESET = 'matiriboys';
      const DOCS_STORAGE_KEY = 'school-download-docs';
      const NEWS_STORAGE_KEY = 'school-news-posts';
      const VACANCIES_STORAGE_KEY = 'school-vacancies';
      const ALUMNI_STORAGE_KEY = 'school-alumni-registrations';
      const SETTINGS_STORAGE_KEY = 'school-site-settings';
      const ADMISSIONS_SETTINGS_ID = 'admissions';
      let activeEditState = null;

      const FIREBASE_CONFIG = {
        apiKey: 'AIzaSyBIGqZLYcDg3CR5VamDwBhtOOfl2Y0NYeI',
        authDomain: 'timotech-films.firebaseapp.com',
        projectId: 'timotech-films',
        storageBucket: 'timotech-films.firebasestorage.app',
        messagingSenderId: '563809562931',
        appId: '1:563809562931:web:750ff7e819f2d57e9dce46'
      };

      let db = null;
      let auth = null;
      let currentAdminUser = null;
      let isContentSyncing = false;

      if (window.firebase?.app && typeof window.firebase.initializeApp === 'function') {
        const hasConfig = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.authDomain && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.appId;
        if (hasConfig) {
          try {
            window.firebase.initializeApp(FIREBASE_CONFIG);
            db = window.firebase.firestore();
            auth = window.firebase.auth();
          } catch (error) {
            console.warn('Firebase initialization failed:', error);
          }
        }
      }

      async function syncPostsAndVacanciesFromFirestore() {
        if (!db || isContentSyncing) {
          return;
        }

        isContentSyncing = true;
        try {
          const [newsSnapshot, vacancySnapshot] = await Promise.all([
            db.collection('news-posts').orderBy('createdAt', 'desc').get(),
            db.collection('vacancies').orderBy('createdAt', 'desc').get()
          ]);

          const remoteNewsPosts = [];
          newsSnapshot.forEach((doc) => {
            remoteNewsPosts.push({ ...doc.data(), id: doc.id });
          });

          const remoteVacancies = [];
          vacancySnapshot.forEach((doc) => {
            remoteVacancies.push({ ...doc.data(), id: doc.id });
          });

          localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(remoteNewsPosts));
          localStorage.setItem(VACANCIES_STORAGE_KEY, JSON.stringify(remoteVacancies));
          window.dispatchEvent(new Event('school-news-updated'));
          window.dispatchEvent(new Event('school-vacancies-updated'));
        } catch (error) {
          console.warn('Firestore content sync failed:', error);
        } finally {
          isContentSyncing = false;
        }
      }

      function setAdmissionsToggleState(isOpen) {
        if (!admissionsToggle || !admissionsToggleText) {
          return;
        }

        admissionsToggle.checked = isOpen;
        admissionsToggleText.textContent = isOpen ? 'Admissions is open' : 'Admissions is closed';
      }

      const initialSettings = readStoredSiteSettings();
      if (admissionsToggle && admissionsToggleText) {
        const isOpen = getAdmissionsStatusFromSettings(initialSettings);
        setAdmissionsToggleState(isOpen);
      }
      syncAdmissionsStatusFromFirestore();

      function writeNewsToFirestore(post) {
        if (!db) return;
        try {
          db.collection('news-posts').doc(post.id).set({
            title: post.title,
            story: post.story,
            attachmentUrl: post.attachmentUrl || '',
            attachmentFileName: post.attachmentFileName || '',
            attachmentMimeType: post.attachmentMimeType || '',
            youtubeUrl: post.youtubeUrl || '',
            createdAt: post.createdAt,
            updatedAt: post.updatedAt || new Date().toISOString()
          }, { merge: true }).catch((error) => console.warn('Firestore write failed:', error));
        } catch (error) {
          console.warn('Firestore error:', error);
        }
      }

      function deleteNewsFromFirestore(postId) {
        if (!db) return;
        try {
          db.collection('news-posts').doc(postId).delete().catch((error) => console.warn('Firestore delete failed:', error));
        } catch (error) {
          console.warn('Firestore error:', error);
        }
      }

      function writeVacancyToFirestore(vacancy) {
        if (!db) return;
        try {
          db.collection('vacancies').doc(vacancy.id).set({
            vacancyType: vacancy.vacancyType || 'teachers',
            position: vacancy.position || vacancy.pathway || '',
            posts: vacancy.posts ?? vacancy.post ?? 0,
            requirements: vacancy.requirements || vacancy.subjects || '',
            pathway: vacancy.pathway || vacancy.position || '',
            subjects: vacancy.subjects || vacancy.requirements || '',
            post: vacancy.post ?? vacancy.posts ?? 0,
            createdAt: vacancy.createdAt,
            updatedAt: vacancy.updatedAt || new Date().toISOString()
          }, { merge: true }).catch((error) => console.warn('Firestore write failed:', error));
        } catch (error) {
          console.warn('Firestore error:', error);
        }
      }

      function deleteVacancyFromFirestore(vacancyId) {
        if (!db) return;
        try {
          db.collection('vacancies').doc(vacancyId).delete().catch((error) => console.warn('Firestore delete failed:', error));
        } catch (error) {
          console.warn('Firestore error:', error);
        }
      }

      function writeDocumentToFirestore(documentRecord) {
        if (!db) return;
        try {
          db.collection('documents').doc(documentRecord.id).set({
            title: documentRecord.title,
            url: documentRecord.url,
            storageKey: documentRecord.storageKey,
            fileName: documentRecord.fileName || '',
            mimeType: documentRecord.mimeType || '',
            storageType: documentRecord.storageType || 'cloudinary',
            updatedAt: new Date().toISOString()
          }, { merge: true }).catch((error) => console.warn('Firestore document write failed:', error));
        } catch (error) {
          console.warn('Firestore document error:', error);
        }
      }

      function deleteDocumentFromFirestore(documentId) {
        if (!db) return;
        try {
          db.collection('documents').doc(documentId).delete().catch((error) => console.warn('Firestore document delete failed:', error));
        } catch (error) {
          console.warn('Firestore document error:', error);
        }
      }

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function createItemId(prefix = 'item') {
        return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function readStoredDocuments() {
        try {
          return JSON.parse(localStorage.getItem(DOCS_STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function readStoredSiteSettings() {
        try {
          return JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function writeStoredSiteSettings(settings = {}) {
        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
      }

      function getAdmissionsStatusFromSettings(settings = {}) {
        return settings.admissionsOpen !== false;
      }

      async function writeSiteSettingsToFirestore(settingsId, settings = {}) {
        if (!db || !auth?.currentUser) {
          return false;
        }

        try {
          await db.collection('site-settings').doc(settingsId).set({
            admissionsOpen: settings.admissionsOpen,
            updatedAt: new Date().toISOString()
          }, { merge: true });
          return true;
        } catch (error) {
          console.warn('Firestore site settings write failed:', error);
          return false;
        }
      }

      async function syncAdmissionsStatusFromFirestore() {
        if (!db) {
          return;
        }

        try {
          const snapshot = await db.collection('site-settings').doc(ADMISSIONS_SETTINGS_ID).get();
          if (!snapshot.exists) {
            return;
          }

          const settings = snapshot.data() || {};
          const nextAdmissionsOpen = settings.admissionsOpen !== false;
          writeStoredSiteSettings({ admissionsOpen: nextAdmissionsOpen, updatedAt: settings.updatedAt || new Date().toISOString() });
          setAdmissionsToggleState(nextAdmissionsOpen);
        } catch (error) {
          console.warn('Firestore site settings sync failed:', error);
        }
      }

      auth?.onAuthStateChanged?.((user) => {
        currentAdminUser = user;
        if (!user) {
          showToast('Please sign in from the home page to sync this setting with Firebase.', { type: 'info' });
          return;
        }

        statusText.textContent = '';
        syncAdmissionsStatusFromFirestore();
      });

      function writeStoredDocument(storageKey, title, url, metadata = {}) {
        const documents = readStoredDocuments();
        const existing = documents[storageKey] || {};
        const documentRecord = {
          title,
          url,
          storageKey,
          id: existing.id || createItemId('document'),
          fileName: metadata.fileName || existing.fileName || '',
          mimeType: metadata.mimeType || existing.mimeType || '',
          storageType: metadata.storageType || existing.storageType || 'cloudinary'
        };
        documents[storageKey] = documentRecord;
        localStorage.setItem(DOCS_STORAGE_KEY, JSON.stringify(documents));
        writeDocumentToFirestore(documentRecord);
        window.dispatchEvent(new Event('school-documents-updated'));
      }

      function deleteStoredDocument(storageKey) {
        const documents = readStoredDocuments();
        const documentRecord = documents[storageKey];
        delete documents[storageKey];
        localStorage.setItem(DOCS_STORAGE_KEY, JSON.stringify(documents));
        if (documentRecord?.id) {
          deleteDocumentFromFirestore(documentRecord.id);
        }
        window.dispatchEvent(new Event('school-documents-updated'));
      }

      function readStoredNewsPosts() {
        try {
          const posts = JSON.parse(localStorage.getItem(NEWS_STORAGE_KEY) || '[]');
          return Array.isArray(posts) ? posts.map((post) => ({ ...post, id: post.id || createItemId('news') })) : [];
        } catch (error) {
          return [];
        }
      }

      function saveNewsPost(post) {
        const posts = readStoredNewsPosts();
        const newPost = { ...post, id: post.id || createItemId('news') };
        posts.unshift(newPost);
        localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(posts));
        writeNewsToFirestore(newPost);
      }

      function updateNewsPost(postId, updates) {
        const posts = readStoredNewsPosts();
        const existing = posts.find((post) => post.id === postId);
        if (!existing) {
          return;
        }

        Object.assign(existing, updates);
        localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(posts));
        writeNewsToFirestore(existing);
      }

      function deleteNewsPost(postId) {
        const posts = readStoredNewsPosts().filter((post) => post.id !== postId);
        localStorage.setItem(NEWS_STORAGE_KEY, JSON.stringify(posts));
        deleteNewsFromFirestore(postId);
      }

      function readStoredVacancies() {
        try {
          const vacancies = JSON.parse(localStorage.getItem(VACANCIES_STORAGE_KEY) || '[]');
          return Array.isArray(vacancies) ? vacancies.map((vacancy) => ({ ...vacancy, id: vacancy.id || createItemId('vacancy') })) : [];
        } catch (error) {
          return [];
        }
      }

      function readStoredAlumniRegistrations() {
        try {
          const registrations = JSON.parse(localStorage.getItem(ALUMNI_STORAGE_KEY) || '[]');
          return Array.isArray(registrations)
            ? registrations.map((registration) => ({ ...registration, id: registration.id || createItemId('alumni') }))
            : [];
        } catch (error) {
          return [];
        }
      }

      function deleteAlumniRegistration(registrationId) {
        const registrations = readStoredAlumniRegistrations().filter((registration) => registration.id !== registrationId);
        localStorage.setItem(ALUMNI_STORAGE_KEY, JSON.stringify(registrations));

        if (db) {
          try {
            db.collection('alumni-registrations').doc(registrationId).delete().catch((error) => console.warn('Firestore alumni delete failed:', error));
          } catch (error) {
            console.warn('Firestore alumni delete error:', error);
          }
        }

        window.dispatchEvent(new Event('school-alumni-updated'));
      }

      function saveAlumniRegistration(registration) {
        const registrations = readStoredAlumniRegistrations();
        const newRegistration = { ...registration, id: registration.id || createItemId('alumni') };
        registrations.unshift(newRegistration);
        localStorage.setItem(ALUMNI_STORAGE_KEY, JSON.stringify(registrations));

        if (db) {
          try {
            db.collection('alumni-registrations').doc(newRegistration.id).set({
              fullName: newRegistration.fullName || '',
              completionYear: newRegistration.completionYear || '',
              email: newRegistration.email || '',
              phone: newRegistration.phone || '',
              createdAt: newRegistration.createdAt || new Date().toISOString(),
              updatedAt: newRegistration.updatedAt || new Date().toISOString()
            }, { merge: true }).catch((error) => console.warn('Firestore alumni write failed:', error));
          } catch (error) {
            console.warn('Firestore alumni write error:', error);
          }
        }

        window.dispatchEvent(new Event('school-alumni-updated'));
      }

      async function syncAlumniRegistrationsFromFirestore() {
        if (!db) {
          return;
        }

        try {
          const snapshot = await db.collection('alumni-registrations').orderBy('createdAt', 'desc').get();
          const remoteRegistrations = [];
          snapshot.forEach((doc) => {
            const data = doc.data() || {};
            remoteRegistrations.push({
              id: doc.id,
              fullName: data.fullName || '',
              completionYear: data.completionYear || '',
              email: data.email || '',
              phone: data.phone || '',
              createdAt: data.createdAt || new Date().toISOString(),
              updatedAt: data.updatedAt || data.createdAt || new Date().toISOString()
            });
          });

          localStorage.setItem(ALUMNI_STORAGE_KEY, JSON.stringify(remoteRegistrations));
          window.dispatchEvent(new Event('school-alumni-updated'));
        } catch (error) {
          console.warn('Firestore alumni sync failed:', error);
        }
      }

      function saveVacancy(vacancy) {
        const vacancies = readStoredVacancies();
        const newVacancy = { ...vacancy, id: vacancy.id || createItemId('vacancy') };
        vacancies.unshift(newVacancy);
        localStorage.setItem(VACANCIES_STORAGE_KEY, JSON.stringify(vacancies));
        writeVacancyToFirestore(newVacancy);
        window.dispatchEvent(new Event('school-vacancies-updated'));
      }

      function updateVacancy(vacancyId, updates) {
        const vacancies = readStoredVacancies();
        const existing = vacancies.find((vacancy) => vacancy.id === vacancyId);
        if (!existing) {
          return;
        }

        Object.assign(existing, updates);
        localStorage.setItem(VACANCIES_STORAGE_KEY, JSON.stringify(vacancies));
        writeVacancyToFirestore(existing);
        window.dispatchEvent(new Event('school-vacancies-updated'));
      }

      function deleteVacancy(vacancyId) {
        const vacancies = readStoredVacancies().filter((vacancy) => vacancy.id !== vacancyId);
        localStorage.setItem(VACANCIES_STORAGE_KEY, JSON.stringify(vacancies));
        deleteVacancyFromFirestore(vacancyId);
        window.dispatchEvent(new Event('school-vacancies-updated'));
      }

      function updateStoryPlaceholder() {
        const hasContent = storyEditor?.innerText?.trim();
        if (!hasContent) {
          storyEditor?.setAttribute('data-placeholder', 'Write a school news story here');
        }
      }

      function renderManagementPanel() {
        const mode = uploadForm.dataset.mode || 'document';
        const storageKey = uploadForm.dataset.storageKey || 'admissions';

        if (mode === 'alumni') {
          const registrations = readStoredAlumniRegistrations();
          managementHeader.innerHTML = '<th>Name</th><th>Contact</th><th>Year</th><th>Submitted</th>';
          managementCaption.textContent = 'View and manage alumni registrations submitted through the public form.';
          managementBody.innerHTML = registrations.length
            ? registrations.map((registration) => `
                <tr>
                  <td>${escapeHtml(registration.fullName || 'Unnamed alumnus')}</td>
                  <td>${escapeHtml(registration.email || 'No email')}<br>${escapeHtml(registration.phone || 'No phone')}</td>
                  <td>${escapeHtml(registration.completionYear || 'Unknown')}</td>
                  <td>
                    ${escapeHtml(registration.createdAt ? new Date(registration.createdAt).toLocaleString() : 'Pending')}
                    <div class="admin-management__actions">
                      <button type="button" class="admin-action--delete" data-action="delete-alumni" data-id="${escapeHtml(registration.id)}">Delete</button>
                    </div>
                  </td>
                </tr>
              `).join('')
            : '<tr><td colspan="4">No alumni registrations yet.</td></tr>';
          return;
        }

        if (mode === 'news') {
          managementHeader.innerHTML = '<th>Title</th><th>Details</th><th>Actions</th>';
          const posts = readStoredNewsPosts();
          managementCaption.textContent = 'Manage the news posts already published.';
          if (!posts.length) {
            managementBody.innerHTML = '<tr><td colspan="3">No news posts yet.</td></tr>';
            return;
          }

          managementBody.innerHTML = posts.map((post) => `
            <tr>
              <td>${escapeHtml(post.title || 'Untitled post')}</td>
              <td>${escapeHtml(post.story ? post.story.replace(/<[^>]+>/g, ' ').trim().slice(0, 90) : 'No story content')}</td>
              <td>
                <button type="button" class="admin-action--edit" data-action="edit" data-id="${escapeHtml(post.id)}">Edit</button>
                <button type="button" class="admin-action--delete" data-action="delete" data-id="${escapeHtml(post.id)}">Delete</button>
              </td>
            </tr>
          `).join('');
          return;
        }

        if (mode === 'vacancies') {
          const isSupportStaffVacancy = (uploadForm.dataset.vacancyType || 'teachers') === 'support-staff';
          managementHeader.innerHTML = isSupportStaffVacancy
            ? '<th>Position</th><th>Posts</th><th>Requirements</th><th>Actions</th>'
            : '<th>Pathway</th><th>Subjects</th><th>Posts</th><th>Requirements</th><th>Actions</th>';
          const vacancies = readStoredVacancies().filter((vacancy) => {
            const vacancyType = vacancy.vacancyType || 'teachers';
            return vacancyType === (uploadForm.dataset.vacancyType || 'teachers');
          });
          const vacancyTypeLabel = (uploadForm.dataset.vacancyType || 'teachers') === 'support-staff' ? 'support staff' : 'teacher';
          managementCaption.textContent = `Manage the ${vacancyTypeLabel} vacancies already posted.`;
          if (!vacancies.length) {
            managementBody.innerHTML = '<tr><td colspan="4">No vacancies yet.</td></tr>';
            return;
          }

          managementBody.innerHTML = vacancies.map((vacancy) => {
            const isSupportStaffVacancy = (vacancy.vacancyType || 'teachers') === 'support-staff';
            const pathwayValue = escapeHtml(vacancy.pathway || vacancy.position || 'Vacancy');
            const subjectsValue = escapeHtml(vacancy.subjects || '');
            const positionValue = escapeHtml(vacancy.position || vacancy.pathway || 'Vacancy');
            const postsValue = escapeHtml(`${vacancy.posts ?? vacancy.post ?? 0} post${(vacancy.posts ?? vacancy.post ?? 0) === 1 ? '' : 's'}`);
            const requirementsValue = escapeHtml(vacancy.requirements || vacancy.subjects || 'Requirements pending');

            return `
              <tr>
                ${isSupportStaffVacancy ? `<td>${positionValue}</td>` : `<td>${pathwayValue}</td>`}
                ${isSupportStaffVacancy ? '' : `<td>${subjectsValue}</td>`}
                <td>${postsValue}</td>
                <td>${requirementsValue}</td>
                <td>
                  <button type="button" class="admin-action--edit" data-action="edit" data-id="${escapeHtml(vacancy.id)}">Edit</button>
                  <button type="button" class="admin-action--delete" data-action="delete" data-id="${escapeHtml(vacancy.id)}">Delete</button>
                </td>
              </tr>
            `;
          }).join('');
          return;
        }

        managementHeader.innerHTML = '<th>Title</th><th>Details</th><th>Actions</th>';
        const documents = readStoredDocuments();
        const documentItem = documents[storageKey];
        managementCaption.textContent = 'Manage the document already posted for this section.';
        if (!documentItem) {
          managementBody.innerHTML = '<tr><td colspan="3">No document posted yet.</td></tr>';
          return;
        }

        managementBody.innerHTML = `
          <tr>
            <td>${escapeHtml(documentItem.title || 'Untitled document')}</td>
            <td><a href="${escapeHtml(documentItem.url || '#')}" target="_blank" rel="noopener noreferrer">Open file</a></td>
            <td>
              <button type="button" class="admin-action--edit" data-action="edit" data-id="${escapeHtml(storageKey)}">Edit</button>
              <button type="button" class="admin-action--delete" data-action="delete" data-id="${escapeHtml(storageKey)}">Delete</button>
            </td>
          </tr>
        `;
      }

      function resetFormState() {
        activeEditState = null;
        if (submitButton) {
          submitButton.textContent = 'Save upload';
        }
      }

      function beginEdit(mode, item) {
        activeEditState = { mode, id: item.id, storageKey: item.storageKey || item.id };

        if (mode === 'news') {
          titleInput.value = item.title || '';
          storyEditor.innerHTML = item.story || '';
          videoUrlInput.value = item.youtubeUrl || '';
          if (submitButton) {
            submitButton.textContent = 'Update post';
          }
          return;
        }

        if (mode === 'vacancies') {
          pathwayInput.value = item.pathway || item.position || '';
          subjectsInput.value = item.subjects || '';
          positionInput.value = item.position || item.pathway || '';
          postsInput.value = item.posts ?? item.post ?? '';
          requirementsInput.value = item.requirements || item.subjects || '';
          if (submitButton) {
            submitButton.textContent = 'Update';
          }
          return;
        }

        titleInput.value = item.title || '';
        if (submitButton) {
          submitButton.textContent = 'Update upload';
        }
      }

      function updateFormMode(button) {
        resetFormState();
        const isNewsMode = button.dataset.mode === 'news';
        const isVacanciesMode = button.dataset.mode === 'vacancies';
        const isAlumniMode = button.dataset.mode === 'alumni';
        const isDocumentMode = !isNewsMode && !isVacanciesMode && !isAlumniMode;
        const sectionName = button.dataset.section || button.textContent.trim();
        const titleValue = button.dataset.title || sectionName;
        const headingText = button.dataset.heading || sectionName;
        const descriptionText = button.dataset.description || 'Choose a document for this section.';
        const storedDocuments = readStoredDocuments();
        const storedDoc = storedDocuments[button.dataset.storageKey];

        sectionTitle.textContent = sectionName;
        cardHeading.textContent = headingText;
        cardDescription.textContent = descriptionText;
        cardHeading.hidden = isAlumniMode;
        cardDescription.hidden = isAlumniMode;
        adminCard?.classList.toggle('is-alumni-view', isAlumniMode);
        titleInput.value = storedDoc?.title || titleValue;

        titleField.hidden = isVacanciesMode || isAlumniMode;
        titleField.style.display = isVacanciesMode || isAlumniMode ? 'none' : '';
        fileInput.required = isDocumentMode;
        fileInput.accept = '.jpg,.jpeg,.png,.pdf,.doc,.docx';
        fileField.hidden = isVacanciesMode || isAlumniMode;
        fileField.style.display = isVacanciesMode || isAlumniMode ? 'none' : '';
        fileField.querySelector('span').textContent = 'Upload file';

        newsOnlyFields.hidden = !isNewsMode;
        vacanciesFields.hidden = !isVacanciesMode;
        newsOnlyFields.style.display = isNewsMode ? '' : 'none';
        vacanciesFields.style.display = isVacanciesMode ? '' : 'none';

        const isSupportStaffVacancy = isVacanciesMode && button.dataset.vacancyType === 'support-staff';
        if (teacherVacancyFields) {
          teacherVacancyFields.hidden = isSupportStaffVacancy;
          teacherVacancyFields.style.display = isSupportStaffVacancy ? 'none' : '';
        }
        if (supportVacancyFields) {
          supportVacancyFields.hidden = !isSupportStaffVacancy;
          supportVacancyFields.style.display = isSupportStaffVacancy ? '' : 'none';
        }

        if (submitButton) {
          submitButton.hidden = isAlumniMode;
          submitButton.style.display = isAlumniMode ? 'none' : '';
          submitButton.textContent = isNewsMode ? 'Save news post' : isVacanciesMode ? 'Post vacancy' : 'Save upload';
        }

        if (!isNewsMode) {
          storyEditor.innerHTML = '';
          videoUrlInput.value = '';
        }

        if (isNewsMode) {
          storyEditor.innerHTML = '';
        }

        uploadForm.dataset.storageKey = button.dataset.storageKey || '';
        uploadForm.dataset.page = button.dataset.page || '';
        uploadForm.dataset.mode = button.dataset.mode || 'document';
        uploadForm.dataset.vacancyType = button.dataset.vacancyType || 'teachers';

        if (isAlumniMode) {
          uploadForm.hidden = true;
          managementBody.innerHTML = '';
          renderManagementPanel();
          return;
        }

        uploadForm.hidden = false;
        renderManagementPanel();
      }

      function setVacanciesDropdownState(isOpen) {
        if (!vacanciesSidebarGroup) {
          return;
        }

        vacanciesSidebarGroup.classList.toggle('is-open', isOpen);
      }

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          if (button.classList.contains('admin-sidebar__link--parent')) {
            const isOpen = !vacanciesSidebarGroup?.classList.contains('is-open');
            setVacanciesDropdownState(isOpen);
            if (!isOpen) {
              buttons.forEach((item) => item.classList.remove('is-active'));
              button.classList.add('is-active');
              return;
            }

            const firstChild = buttons.find((item) => item.classList.contains('admin-sidebar__link--child') && item.dataset.vacancyType === 'teachers');
            if (firstChild) {
              buttons.forEach((item) => item.classList.remove('is-active'));
              firstChild.classList.add('is-active');
              button.classList.add('is-active');
              updateFormMode(firstChild);
            }
            return;
          }

          buttons.forEach((item) => item.classList.remove('is-active'));
          button.classList.add('is-active');
          if (button.classList.contains('admin-sidebar__link--child')) {
            const parentButton = buttons.find((item) => item.classList.contains('admin-sidebar__link--parent'));
            if (parentButton) {
              parentButton.classList.add('is-active');
            }
            setVacanciesDropdownState(true);
          }
          updateFormMode(button);
        });
      });

      setVacanciesDropdownState(false);

      const initializeAdminView = async () => {
        await syncPostsAndVacanciesFromFirestore();
        await syncAlumniRegistrationsFromFirestore();
        const activeButton = buttons.find((button) => button.classList.contains('is-active')) || buttons[0];
        if (activeButton) {
          activeButton.click();
        }
      };

      initializeAdminView();

      managementBody.addEventListener('click', (event) => {
        const actionButton = event.target.closest('button[data-action]');
        if (!actionButton) {
          return;
        }

        const action = actionButton.dataset.action;
        const itemId = actionButton.dataset.id;

        if (action === 'delete-alumni') {
          deleteAlumniRegistration(itemId);
          renderManagementPanel();
          showToast('Alumni registration removed.', { type: 'info' });
          return;
        }

        if (action === 'delete') {
          if (uploadForm.dataset.mode === 'news') {
            deleteNewsPost(itemId);
          } else if (uploadForm.dataset.mode === 'vacancies') {
            deleteVacancy(itemId);
          } else {
            deleteStoredDocument(itemId);
          }

          renderManagementPanel();
          showToast('Item removed.', { type: 'info' });
          return;
        }

        if (action === 'edit') {
          if (uploadForm.dataset.mode === 'news') {
            const posts = readStoredNewsPosts();
            const post = posts.find((entry) => entry.id === itemId);
            if (post) {
              beginEdit('news', post);
            }
          } else if (uploadForm.dataset.mode === 'vacancies') {
            const vacancies = readStoredVacancies();
            const vacancy = vacancies.find((entry) => entry.id === itemId);
            if (vacancy) {
              beginEdit('vacancies', vacancy);
            }
          } else {
            const documents = readStoredDocuments();
            const documentItem = documents[itemId];
            if (documentItem) {
              beginEdit('document', documentItem);
            }
          }
        }
      });

      document.querySelectorAll('.admin-richtext__button').forEach((button) => {
        button.addEventListener('click', () => {
          const command = button.dataset.command;
          const value = button.dataset.value || null;

          if (command === 'hiliteColor') {
            document.execCommand('hiliteColor', false, value);
            button.classList.add('is-active');
            storyEditor.focus();
            return;
          }

          document.execCommand(command, false, value);
          button.classList.toggle('is-active');
          storyEditor.focus();
        });
      });

      storyEditor.addEventListener('mouseup', () => {
        document.querySelectorAll('.admin-richtext__button').forEach((button) => {
          const command = button.dataset.command;
          if (command === 'bold' && document.queryCommandState('bold')) {
            button.classList.add('is-active');
          } else if (command === 'italic' && document.queryCommandState('italic')) {
            button.classList.add('is-active');
          } else if (command === 'underline' && document.queryCommandState('underline')) {
            button.classList.add('is-active');
          } else if (command === 'insertUnorderedList' && document.queryCommandState('insertUnorderedList')) {
            button.classList.add('is-active');
          } else if (command === 'insertOrderedList' && document.queryCommandState('insertOrderedList')) {
            button.classList.add('is-active');
          } else if (command === 'formatBlock' && document.queryCommandState('formatBlock')) {
            button.classList.add('is-active');
          } else {
            button.classList.remove('is-active');
          }
        });
      });

      storyEditor.addEventListener('input', updateStoryPlaceholder);
      storyEditor.addEventListener('blur', updateStoryPlaceholder);

      admissionsToggle?.addEventListener('change', async () => {
        const isAdmissionsOpen = admissionsToggle.checked;
        const settings = readStoredSiteSettings();
        settings.admissionsOpen = isAdmissionsOpen;
        settings.updatedAt = new Date().toISOString();
        writeStoredSiteSettings(settings);
        setAdmissionsToggleState(isAdmissionsOpen);

        const firebaseSaved = await writeSiteSettingsToFirestore(ADMISSIONS_SETTINGS_ID, settings);
        if (firebaseSaved) {
          showToast(isAdmissionsOpen ? 'Admissions opened successfully.' : 'Admissions closed successfully.', { type: 'success' });
        } else if (!auth?.currentUser) {
          showToast('Saved locally on this device. Sign in with an admin account to sync the public website in Firestore.', { type: 'info' });
        } else {
          showToast('The Firebase site settings update is not available right now. Your local setting has been saved.', { type: 'info' });
        }
      });

      uploadForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (uploadForm.dataset.mode === 'alumni') {
          renderManagementPanel();
          return;
        }

        const isNewsMode = uploadForm.dataset.mode === 'news';
        const isVacanciesMode = uploadForm.dataset.mode === 'vacancies';
        const documentTitle = titleInput.value.trim() || (isNewsMode ? 'School news story' : isVacanciesMode ? 'Vacancy' : 'Document');
        const storageKey = uploadForm.dataset.storageKey || (isNewsMode ? 'news' : isVacanciesMode ? 'vacancies' : 'admissions');
        const pageName = uploadForm.dataset.page || 'application-form.html';

        if (activeEditState?.mode === 'vacancies') {
          const posts = postsInput.value.trim();
          const requirements = requirementsInput.value.trim();
          const isSupportStaffVacancy = uploadForm.dataset.vacancyType === 'support-staff';
          const pathway = pathwayInput.value.trim();
          const subjects = subjectsInput.value.trim();
          const position = positionInput.value.trim();

          if (isSupportStaffVacancy) {
            if (!position || !posts || !requirements) {
              showToast('Please fill in the position, posts, and requirements fields.', { type: 'error' });
              return;
            }
          } else if (!pathway || !subjects || !posts || !requirements) {
            showToast('Please fill in the pathway, subjects, posts, and requirements fields.', { type: 'error' });
            return;
          }

          updateVacancy(activeEditState.id, {
            position: isSupportStaffVacancy ? position : pathway,
            posts: Number(posts),
            requirements,
            pathway: isSupportStaffVacancy ? position : pathway,
            subjects: isSupportStaffVacancy ? '' : subjects,
            post: Number(posts),
            vacancyType: uploadForm.dataset.vacancyType || 'teachers',
            updatedAt: new Date().toISOString()
          });

          showToast(`Vacancy updated for ${isSupportStaffVacancy ? position : pathway}.`, { type: 'success' });
          uploadForm.reset();
          titleInput.value = documentTitle;
          pathwayInput.value = '';
          subjectsInput.value = '';
          positionInput.value = '';
          postsInput.value = '';
          requirementsInput.value = '';
          resetFormState();
          renderManagementPanel();
          return;
        }

        if (isVacanciesMode) {
          const posts = postsInput.value.trim();
          const requirements = requirementsInput.value.trim();
          const isSupportStaffVacancy = uploadForm.dataset.vacancyType === 'support-staff';
          const pathway = pathwayInput.value.trim();
          const subjects = subjectsInput.value.trim();
          const position = positionInput.value.trim();

          if (isSupportStaffVacancy) {
            if (!position || !posts || !requirements) {
              showToast('Please fill in the position, posts, and requirements fields.', { type: 'error' });
              return;
            }
          } else if (!pathway || !subjects || !posts || !requirements) {
            showToast('Please fill in the pathway, subjects, posts, and requirements fields.', { type: 'error' });
            return;
          }

          saveVacancy({
            position: isSupportStaffVacancy ? position : pathway,
            posts: Number(posts),
            requirements,
            pathway: isSupportStaffVacancy ? position : pathway,
            subjects: isSupportStaffVacancy ? '' : subjects,
            post: Number(posts),
            vacancyType: uploadForm.dataset.vacancyType || 'teachers',
            createdAt: new Date().toISOString()
          });

          showToast(`Vacancy saved for ${isSupportStaffVacancy ? position : pathway}.`, { type: 'success' });
          uploadForm.reset();
          titleInput.value = documentTitle;
          pathwayInput.value = '';
          subjectsInput.value = '';
          positionInput.value = '';
          postsInput.value = '';
          requirementsInput.value = '';
          renderManagementPanel();
          return;
        }

        if (activeEditState?.mode === 'news') {
          const storyHtml = storyEditor.innerHTML.trim();
          const storyText = storyEditor.innerText.trim();
          const youtubeUrl = videoUrlInput.value.trim();

          updateNewsPost(activeEditState.id, {
            title: documentTitle,
            story: storyHtml || storyText,
            youtubeUrl,
            updatedAt: new Date().toISOString()
          });

          showToast(`News post updated. “${documentTitle}” has been revised.`, { type: 'success' });
          uploadForm.reset();
          titleInput.value = documentTitle;
          storyEditor.innerHTML = '';
          videoUrlInput.value = '';
          resetFormState();
          renderManagementPanel();
          return;
        }

        if (isNewsMode) {
          const storyHtml = storyEditor.innerHTML.trim();
          const storyText = storyEditor.innerText.trim();
          const youtubeUrl = videoUrlInput.value.trim();
          const attachedFile = fileInput.files[0];

          if (!storyText && !attachedFile && !youtubeUrl) {
            showToast('Please add a story, an attachment, or a YouTube link.', { type: 'error' });
            return;
          }

          let attachmentUrl = '';
          let attachmentFileName = '';
          let attachmentMimeType = '';
          if (attachedFile) {
            showToast('Uploading attachment to Cloudinary...', { type: 'info' });
            const formData = new FormData();
            formData.append('file', attachedFile);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('folder', 'school-news');

            try {
              const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`, {
                method: 'POST',
                body: formData
              });
              const result = await response.json();

              if (!response.ok) {
                throw new Error(result.error?.message || 'Attachment upload failed');
              }

              attachmentUrl = result.secure_url;
              attachmentFileName = attachedFile.name;
              attachmentMimeType = attachedFile.type || 'application/octet-stream';
            } catch (error) {
              showToast(`News save failed: ${error.message}`, { type: 'error' });
              return;
            }
          }

          saveNewsPost({
            title: documentTitle,
            story: storyHtml || storyText,
            attachmentUrl,
            attachmentFileName,
            attachmentMimeType,
            youtubeUrl,
            createdAt: new Date().toISOString()
          });

          showToast(`News post saved. “${documentTitle}” is ready for the school news section.`, { type: 'success' });
          uploadForm.reset();
          titleInput.value = documentTitle;
          storyEditor.innerHTML = '';
          videoUrlInput.value = '';
          renderManagementPanel();
          return;
        }

        if (activeEditState?.mode === 'document') {
          const existingDocument = readStoredDocuments()[activeEditState.storageKey];
          writeStoredDocument(activeEditState.storageKey, documentTitle, existingDocument?.url || '');
          showToast(`Document updated. “${documentTitle}” was revised.`, { type: 'success' });
          uploadForm.reset();
          titleInput.value = documentTitle;
          resetFormState();
          renderManagementPanel();
          return;
        }

        const file = fileInput.files[0];
        if (!file) {
          showToast('Please choose a file first.', { type: 'error' });
          return;
        }

        if (submitButton) {
          submitButton.disabled = true;
        }

        let progressContainer = document.getElementById('admin-upload-progress');
        if (!progressContainer) {
          progressContainer = document.createElement('div');
          progressContainer.className = 'admin-form__progress';
          progressContainer.id = 'admin-upload-progress';
          progressContainer.innerHTML = `
            <div class="admin-form__progress-bar">
              <div class="admin-form__progress-fill" id="admin-progress-fill"></div>
            </div>
            <p class="admin-form__progress-text" id="admin-progress-text">0%</p>
          `;
          fileField.insertAdjacentElement('afterend', progressContainer);
        }

        const progressFill = document.getElementById('admin-progress-fill');
        const progressText = document.getElementById('admin-progress-text');
        progressFill.style.width = '0%';
        progressText.textContent = '0%';
        progressContainer.hidden = false;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        formData.append('folder', 'school-documents');

        const xhr = new XMLHttpRequest();

        xhr.upload.addEventListener('progress', (event) => {
          if (!event.lengthComputable) {
            return;
          }

          const percentComplete = Math.round((event.loaded / event.total) * 100);
          progressFill.style.width = `${percentComplete}%`;
          progressText.textContent = `${percentComplete}%`;
        });

        xhr.addEventListener('load', () => {
          progressContainer.remove();
          if (submitButton) {
            submitButton.disabled = false;
          }

          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const result = JSON.parse(xhr.responseText);

              writeStoredDocument(storageKey, documentTitle, result.secure_url, {
                fileName: file.name,
                mimeType: file.type || 'application/octet-stream',
                storageType: 'cloudinary'
              });

              showToast('Uploaded successfully.', { type: 'success' });
              uploadForm.reset();
              titleInput.value = documentTitle;
              renderManagementPanel();
            } catch (error) {
              showToast(`Upload failed: ${error.message}`, { type: 'error' });
            }
          } else {
            try {
              const result = JSON.parse(xhr.responseText);
              showToast(result.error?.message || 'Upload failed', { type: 'error' });
            } catch (error) {
              showToast('Upload failed', { type: 'error' });
            }
          }
        });

        xhr.addEventListener('error', () => {
          progressContainer.remove();
          if (submitButton) {
            submitButton.disabled = false;
          }
          showToast('Upload failed: network error.', { type: 'error' });
        });

        xhr.addEventListener('abort', () => {
          progressContainer.remove();
          if (submitButton) {
            submitButton.disabled = false;
          }
          showToast('Upload cancelled.', { type: 'info' });
        });

        try {
          xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`);
          xhr.send(formData);
        } catch (error) {
          progressContainer.remove();
          if (submitButton) {
            submitButton.disabled = false;
          }
          showToast(`Upload failed: ${error.message}`, { type: 'error' });
        }
      });

      // Logout functionality
      const logoutButton = document.getElementById('admin-logout-button');
      if (logoutButton) {
        logoutButton.addEventListener('click', () => {
          // Show loading state
          stateManager.setButtonLoading('admin-logout-button', true, {
            loadingText: 'Logging out...'
          });

          if (auth) {
            auth.signOut().then(() => {
              window.location.href = '../home/';
            }).catch((error) => {
              console.error('Logout failed:', error);
              // Hide loading state and redirect anyway if logout fails
              stateManager.setButtonLoading('admin-logout-button', false);
              window.location.href = '../home/';
            });
          } else {
            // If Firebase is not configured, just redirect
            window.location.href = '../home/';
          }
        });
      }
    </script>
  </body>
</html>
