<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3b66" />
    <title>Vacancies | Matiri Boys' Senior School</title>
    <meta name="description" content="View current school vacancies and recruitment updates." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/shared.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/mobile.css" />
    <link rel="stylesheet" href="../styles/chat-assistant.css" />
    <link rel="icon" href="../logo/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="../logo/favicon.ico" type="image/x-icon" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { renderHeader } from '../js/modules/header.js';
      import { initChatAssistant } from '../js/chat-assistant.js';
      import { createOfflineNoticeMarkup, isBrowserOnline } from '../js/modules/network-status.js';

      const app = document.getElementById('app');
      const VACANCIES_STORAGE_KEY = 'school-vacancies';

      // Firebase configuration
      const FIREBASE_CONFIG = {
        apiKey: 'AIzaSyBIGqZLYcDg3CR5VamDwBhtOOfl2Y0NYeI',
        authDomain: 'timotech-films.firebaseapp.com',
        projectId: 'timotech-films',
        storageBucket: 'timotech-films.firebasestorage.app',
        messagingSenderId: '563809562931',
        appId: '1:563809562931:web:750ff7e819f2d57e9dce46',
      };

      let firebaseDb = null;
      if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) {
        firebase.initializeApp(FIREBASE_CONFIG);
        firebaseDb = firebase.firestore();
      }

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function readStoredVacancies() {
        try {
          return JSON.parse(window.localStorage.getItem(VACANCIES_STORAGE_KEY) || '[]');
        } catch (error) {
          return [];
        }
      }

      function getSelectedVacancyType() {
        const params = new URLSearchParams(window.location.search);
        const requestedType = params.get('type');
        return requestedType === 'support-staff' ? 'support-staff' : 'teachers';
      }

      async function fetchVacanciesFromFirestore() {
        if (!isBrowserOnline() || !firebaseDb) {
          return { vacancies: readStoredVacancies(), offline: true };
        }

        try {
          const snapshot = await firebaseDb.collection('vacancies').orderBy('createdAt', 'desc').get();
          const vacancies = [];
          snapshot.forEach((doc) => {
            vacancies.push({ ...doc.data(), id: doc.id });
          });
          return { vacancies: vacancies.length > 0 ? vacancies : readStoredVacancies(), offline: false };
        } catch (error) {
          console.warn('Firestore fetch failed, using localStorage:', error);
          return { vacancies: readStoredVacancies(), offline: true };
        }
      }

      function formatBadge(item) {
        const createdAt = item.createdAt ? new Date(item.createdAt) : null;
        if (!createdAt || Number.isNaN(createdAt.getTime())) {
          return '<span class="vacancies-badge vacancies-badge--new">New</span>';
        }

        const now = new Date();
        const oneWeekAgo = new Date(now);
        oneWeekAgo.setDate(now.getDate() - 7);

        if (createdAt >= oneWeekAgo) {
          return '<span class="vacancies-badge vacancies-badge--new">New</span>';
        }

        return `<span class="vacancies-badge vacancies-badge--date">${createdAt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</span>`;
      }

      function buildApplicationMailto(vacancyType, vacancyTitle, formData) {
        const recipient = 'janekarithi3@gmail.com';
        const isSupportStaff = vacancyType === 'support-staff';
        const subject = `Application for ${vacancyTitle}`;
        const attachmentLabel = formData.attachments?.trim() ? `Attachments: ${formData.attachments}` : 'Attachments: None provided';
        const lines = [
          `Vacancy type: ${isSupportStaff ? 'Support staff' : 'Teacher'}`,
          `Vacancy: ${vacancyTitle}`,
          `Full name: ${formData.fullName}`,
          `Phone number: ${formData.phone}`,
          isSupportStaff ? `ID number: ${formData.idNumber}` : `Email: ${formData.email}`,
          isSupportStaff ? attachmentLabel : `Gender: ${formData.gender}`,
          isSupportStaff ? '' : `ID number: ${formData.idNumber}`,
          `Application letter: ${formData.applicationLetter}`,
          `CV: ${formData.cv}`,
          '',
          'Please attach the application letter and CV files manually in your email client if needed.'
        ];
        const body = lines.join('\n');
        return `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      }

      function createVacanciesLoadingMarkup() {
        return `
          <div class="page-loading-shell" aria-live="polite">
            <div class="page-loading-spinner">Loading opportunities…</div>
            <div class="page-loading-card">
              <div class="page-loading-row">
                <span class="page-loading-pill"></span>
                <span class="page-loading-bar page-loading-bar--full"></span>
              </div>
              <span class="page-loading-bar page-loading-bar--medium"></span>
              <span class="page-loading-bar page-loading-bar--full"></span>
            </div>
            <div class="page-loading-card">
              <span class="page-loading-bar page-loading-bar--short"></span>
              <span class="page-loading-bar page-loading-bar--full"></span>
              <span class="page-loading-bar page-loading-bar--medium"></span>
            </div>
          </div>
        `;
      }

      function createApplyModal() {
        const modal = document.createElement('div');
        modal.className = 'vacancy-apply-modal';
        modal.hidden = true;
        modal.innerHTML = `
          <div class="vacancy-apply-modal__backdrop" data-role="close"></div>
          <div class="vacancy-apply-modal__panel" role="dialog" aria-modal="true" aria-labelledby="vacancy-apply-modal-title">
            <button type="button" class="vacancy-apply-modal__close" data-role="close" aria-label="Close application form">×</button>
            <h2 id="vacancy-apply-modal-title">Apply for this vacancy</h2>
            <p class="vacancy-apply-modal__intro">Your application will be sent to the school email address.</p>
            <form class="vacancy-apply-modal__form" id="vacancy-apply-form">
              <div class="vacancy-apply-modal__grid">
                <label class="vacancy-apply-modal__field">
                  <span>Full name</span>
                  <input type="text" name="fullName" required />
                </label>
                <label class="vacancy-apply-modal__field">
                  <span>Phone number</span>
                  <input type="tel" name="phone" required />
                </label>
                <label class="vacancy-apply-modal__field" id="vacancy-apply-email-field">
                  <span>Email</span>
                  <input type="email" name="email" />
                </label>
                <label class="vacancy-apply-modal__field" id="vacancy-apply-gender-field">
                  <span>Gender</span>
                  <select name="gender">
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                  </select>
                </label>
                <label class="vacancy-apply-modal__field">
                  <span>ID number</span>
                  <input type="text" name="idNumber" required />
                </label>
                <label class="vacancy-apply-modal__field" id="vacancy-apply-attachment-field">
                  <span>Attach application letter &amp; CV</span>
                  <input type="file" name="attachments" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" />
                </label>
              </div>
              <label class="vacancy-apply-modal__field">
                <span>Application summary</span>
                <textarea name="applicationLetter" rows="4" placeholder="Share a short note about your motivation and suitability."></textarea>
              </label>
              <label class="vacancy-apply-modal__field">
                <span>Additional CV notes</span>
                <textarea name="cv" rows="4" placeholder="Add any extra experience or qualifications you would like to mention."></textarea>
              </label>
              <div class="vacancy-apply-modal__actions">
                <button type="submit" class="button button--primary vacancy-apply-modal__submit">Send application</button>
                <button type="button" class="button button--secondary vacancy-apply-modal__cancel" data-role="close">Cancel</button>
              </div>
              <p class="vacancy-apply-modal__status" id="vacancy-apply-status" aria-live="polite"></p>
            </form>
          </div>
        `;

        const closeModal = () => {
          modal.hidden = true;
          document.body.classList.remove('has-vacancy-apply-modal');
        };

        modal.querySelectorAll('[data-role="close"]').forEach((element) => {
          element.addEventListener('click', closeModal);
        });

        modal.querySelector('#vacancy-apply-form').addEventListener('submit', (event) => {
          event.preventDefault();
          const form = event.currentTarget;
          const formData = Object.fromEntries(new FormData(form).entries());
          const status = modal.querySelector('#vacancy-apply-status');
          const vacancyTitle = modal.dataset.vacancyTitle || 'this vacancy';
          const vacancyType = modal.dataset.vacancyType || 'teachers';
          const isSupportStaff = vacancyType === 'support-staff';
          const fileInput = form.querySelector('input[name="attachments"]');
          const attachmentNames = Array.from(fileInput?.files || []).map((file) => file.name).join(', ');
          const nextFormData = {
            ...formData,
            attachments: attachmentNames || formData.attachments || ''
          };

          if (!formData.fullName || !formData.phone || !formData.idNumber) {
            status.textContent = 'Please complete the required fields before sending your application.';
            status.style.color = '#b91c1c';
            return;
          }

          if (!isSupportStaff && (!formData.email || !formData.gender)) {
            status.textContent = 'Please provide your email address and gender for teacher applications.';
            status.style.color = '#b91c1c';
            return;
          }

          if (isSupportStaff && !attachmentNames) {
            status.textContent = 'Please select at least one supporting file for support-staff applications.';
            status.style.color = '#b91c1c';
            return;
          }

          const mailtoUrl = buildApplicationMailto(vacancyType, vacancyTitle, nextFormData);
          status.textContent = 'Opening your email app with your application details...';
          status.style.color = '#15803d';
          window.location.href = mailtoUrl;
        });

        return modal;
      }

      async function renderPage() {
        if (!app) {
          return;
        }

        app.innerHTML = '';
        app.appendChild(renderHeader());

        const section = document.createElement('section');
        section.className = 'vacancies-page';
        section.innerHTML = `
          <div class="container">
            <div class="vacancies-card">
              <div class="standalone-topbar">
                <button type="button" class="button button--secondary standalone-back">Back</button>
              </div>
              <p class="eyebrow">Vacancies</p>
              <h1>Current opportunities</h1>
              <p class="legal-intro">Browse the latest vacancies posted by the school.</p>
              <div id="vacancies-table-wrap" class="vacancies-table-wrap">${createVacanciesLoadingMarkup()}</div>
            </div>
          </div>
        `;

        app.appendChild(section);

        const tableWrap = section.querySelector('#vacancies-table-wrap');
        tableWrap.innerHTML = createVacanciesLoadingMarkup();

        const { vacancies, offline } = await fetchVacanciesFromFirestore();
        const vacancyType = getSelectedVacancyType();
        const visibleVacancies = vacancies.filter((item) => (item.vacancyType || 'teachers') === vacancyType);
        const isSupportStaff = vacancyType === 'support-staff';
        const sectionHeading = section.querySelector('h1');
        const sectionIntro = section.querySelector('.legal-intro');

        if (sectionHeading) {
          sectionHeading.textContent = isSupportStaff ? 'Support staff opportunities' : 'Teaching opportunities';
        }

        if (sectionIntro) {
          sectionIntro.textContent = isSupportStaff
            ? 'Browse current support-staff vacancies posted by the school.'
            : 'Browse current teaching vacancies posted by the school.';
        }

        if (offline && !visibleVacancies.length) {
          tableWrap.innerHTML = createOfflineNoticeMarkup({
            title: 'Vacancies unavailable right now',
            message: 'We could not load current vacancies because the connection is unavailable or the feed is temporarily unreachable.'
          });
        } else if (!visibleVacancies.length) {
          tableWrap.innerHTML = '<div class="vacancies-empty">No vacancies are available for this section at the moment.</div>';
        } else {
          tableWrap.innerHTML = `
            <table class="vacancies-table">
              <thead>
                <tr>
                  <th>Status</th>
                  ${isSupportStaff ? '<th>Position</th><th>Posts</th><th>Requirements</th>' : '<th>Pathway</th><th>Subjects</th><th>Posts</th><th>Requirements</th>'}
                  <th>Apply</th>
                </tr>
              </thead>
              <tbody>
                ${visibleVacancies.map((item) => `
                  <tr>
                    <td>${formatBadge(item)}</td>
                    ${isSupportStaff
                      ? `<td>${escapeHtml(item.position || item.pathway || 'To be confirmed')}</td><td>${escapeHtml(String(item.posts ?? item.post ?? 0))}</td><td>${escapeHtml(item.requirements || item.subjects || 'To be confirmed')}</td>`
                      : `<td>${escapeHtml(item.pathway || item.position || 'To be confirmed')}</td><td>${escapeHtml(item.subjects || 'To be confirmed')}</td><td>${escapeHtml(String(item.posts ?? item.post ?? 0))}</td><td>${escapeHtml(item.requirements || 'To be confirmed')}</td>`}
                    <td>
                      <button type="button" class="button button--secondary vacancy-apply-button" data-vacancy='${escapeHtml(JSON.stringify(item))}'>Apply</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        const backButton = section.querySelector('.standalone-back');
        if (backButton) {
          backButton.addEventListener('click', () => {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.assign('../home/');
            }
          });
        }

        const applyModal = createApplyModal();
        document.body.appendChild(applyModal);

        const openApplyModal = (vacancy) => {
          const isSupportStaff = (vacancy.vacancyType || 'teachers') === 'support-staff';
          const modalTitle = vacancy.position || vacancy.pathway || 'Vacancy';
          const modal = document.body.querySelector('.vacancy-apply-modal');
          if (!modal) {
            return;
          }

          modal.dataset.vacancyTitle = modalTitle;
          modal.dataset.vacancyType = isSupportStaff ? 'support-staff' : 'teachers';
          modal.querySelector('#vacancy-apply-modal-title').textContent = `Apply for ${modalTitle}`;
          modal.querySelector('#vacancy-apply-email-field').hidden = isSupportStaff;
          modal.querySelector('#vacancy-apply-gender-field').hidden = isSupportStaff;
          modal.querySelector('#vacancy-apply-attachment-field').hidden = !isSupportStaff;
          modal.querySelector('#vacancy-apply-form').reset();
          modal.querySelector('#vacancy-apply-status').textContent = '';
          modal.hidden = false;
          document.body.classList.add('has-vacancy-apply-modal');
          modal.querySelector('input[name="fullName"]').focus();
        };

        const applyButtons = section.querySelectorAll('.vacancy-apply-button');
        applyButtons.forEach((button) => {
          button.addEventListener('click', () => {
            const vacancy = JSON.parse(button.dataset.vacancy || '{}');
            openApplyModal(vacancy);
          });
        });
      }

      renderPage().then(() => {
        initChatAssistant();
      }).catch((error) => {
        console.error('Failed to render vacancies page:', error);
      });

      window.addEventListener('storage', () => renderPage().catch(console.error));
      window.addEventListener('school-vacancies-updated', () => renderPage().catch(console.error));
    </script>
  </body>
</html>
